[project]
name = "radial-pulse-api"
version = "0.1.0"
description = "Radial Pulse platform API (FastAPI). Owns identity, tenancy, RBAC, shared contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0.40,<2.2",
  "alembic>=1.15",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.8",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "boto3>=1.38",
  # Timezone names for Settings → General (slim Docker images have no system tz database).
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "mypy>=1.15",
  "boto3-stubs[s3]>=1.38",
  "pip-audit>=2.9",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["alembic/versions/*.py.mako"]

[tool.ruff.lint]
select = [
  "E", "W", "F",      # pycodestyle + pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "S",                # bandit (security)
  "N",                # naming
  "SIM",              # simplify
  "RUF",
  "T20",              # no print()
  "DTZ",              # timezone-aware datetimes
  "PTH",              # pathlib
]
ignore = [
  "B008",   # FastAPI Depends() in defaults is the intended pattern
  "RUF012", # SQLAlchemy/pydantic class attrs
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# The local ./alembic folder holds migrations; the `alembic` import is the library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608"]
"alembic/**" = ["E501", "S608"]  # DDL built from module constants, never user input

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Security"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a real PostgreSQL (TEST_DATABASE_URL). Run with `make integration-test`.",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/openapi_export.py"]
