AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Radial Pulse Central DEV - network stack, NO NAT GATEWAY (10 Oct 2026). VPC in 2 AZs with
  app subnets (CloudShell migration runner; later the Lambda) and db subnets; neither has a
  route to the internet. A free S3 gateway endpoint serves the app subnets. Public subnets and
  an internet gateway exist but hold nothing (reserved for a NAT gateway if one is ever added).
  Deploy this ONLY if Central DEV has no Radial Pulse VPC yet; otherwise pass the existing IDs to
  central-db-dev.yaml. Runbook: docs/infrastructure/central-dev-db-setup.md

Parameters:
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: '^\d{1,3}\.\d{1,3}\.0\.0/16$'
    Description: A /16 that does not overlap other Radial Pulse VPCs.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true      # needed to resolve the Aurora endpoint
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: rp-central-vpc-dev

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: rp-central-igw-dev

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ------------------------------------------------------------------ subnets (2 AZs)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 32, 8]]   # x.x.0.0/24
      MapPublicIpOnLaunch: false   # nothing is placed here; reserved for a NAT gateway
      Tags:
        - Key: Name
          Value: rp-central-public-a-dev

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 32, 8]]   # x.x.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: rp-central-public-b-dev

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 32, 8]]  # x.x.10.0/24
      Tags:
        - Key: Name
          Value: rp-central-app-a-dev

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 32, 8]]  # x.x.11.0/24
      Tags:
        - Key: Name
          Value: rp-central-app-b-dev

  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [20, !Cidr [!Ref VpcCidr, 32, 8]]  # x.x.20.0/24
      Tags:
        - Key: Name
          Value: rp-central-db-a-dev

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [21, !Cidr [!Ref VpcCidr, 32, 8]]  # x.x.21.0/24
      Tags:
        - Key: Name
          Value: rp-central-db-b-dev

  # ------------------------------------------------------------------ NO NAT gateway
  # Decided 10 Oct 2026: no NAT gateway and no Elastic IP (about 45 USD/month saved). The app
  # subnets therefore have NO route to the internet: only the VPC itself, the S3 gateway
  # endpoint below, and any interface endpoints added by other stacks. A Lambda in these
  # subnets cannot reach Cognito (JWKS, admin API, Managed Login userInfo): see
  # docs/infrastructure/central-dev-db-setup.md, section "No NAT: what works and what does not".

  # ------------------------------------------------------------------ route tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: rp-central-rt-public-dev

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: rp-central-rt-app-dev

  # App route table: local VPC traffic + the S3 gateway endpoint (added by S3GatewayEndpoint).
  # No 0.0.0.0/0 route on purpose (no NAT).

  AppSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref AppRouteTable

  AppSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref AppRouteTable

  # DB route table: local VPC traffic only. No internet route on purpose.
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: rp-central-rt-db-dev

  DbSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetA
      RouteTableId: !Ref DbRouteTable

  DbSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetB
      RouteTableId: !Ref DbRouteTable

  # ------------------------------------------------------------------ S3 gateway endpoint (free)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref AppRouteTable

Outputs:
  VpcId:
    Description: Pass to central-db-dev.yaml as VpcId
    Value: !Ref Vpc
  DbSubnetIds:
    Description: Pass to central-db-dev.yaml as DbSubnetIds (no internet route)
    Value: !Join [",", [!Ref DbSubnetA, !Ref DbSubnetB]]
  AppSubnetIds:
    Description: CloudShell migration subnets (and the Lambda, once it may run without internet). No internet route.
    Value: !Join [",", [!Ref AppSubnetA, !Ref AppSubnetB]]
  PublicSubnetIds:
    Description: Empty, reserved for a NAT gateway. Put nothing else here.
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  AppRouteTableId:
    Description: Route table of the app subnets (a NAT add-on stack would add its 0.0.0.0/0 route here)
    Value: !Ref AppRouteTable
  S3GatewayEndpointId:
    Value: !Ref S3GatewayEndpoint
  InternetEgress:
    Description: How the app subnets reach the internet
    Value: none (no NAT gateway; S3 through the gateway endpoint only)
