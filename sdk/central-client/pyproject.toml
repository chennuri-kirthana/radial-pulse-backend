[project]
name = "radial-central-client"
version = "0.3.0"
description = "Internal SDK for backend services calling the Radial Pulse Central API (/api/v1/internal), signed with the service's own AWS IAM role (SigV4)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
#: Sign requests with the service's IAM role (SigV4). botocore comes with boto3. Needed in AWS.
aws = ["boto3>=1.38"]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.15"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radial_central_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# boto3/botocore are the optional extra ("aws"), imported only when SigV4Signer is created.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
